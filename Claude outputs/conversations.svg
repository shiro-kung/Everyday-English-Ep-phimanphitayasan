<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1224"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <circle cx="860" cy="150" r="220" fill="url(#glow)" filter="url(#blur1)"/>

  <!-- small chat dots scattered -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="120" cy="90" r="8"/>
    <circle cx="180" cy="150" r="5"/>
    <circle cx="90" cy="260" r="6"/>
    <circle cx="260" cy="90" r="4"/>
    <circle cx="220" cy="300" r="7"/>
  </g>

  <!-- speech bubble 1 (outline) -->
  <g transform="translate(700,80)">
    <path d="M20 0 H260 a20 20 0 0 1 20 20 V130 a20 20 0 0 1 -20 20 H80 L40 190 L50 150 H20 a20 20 0 0 1 -20 -20 V20 A20 20 0 0 1 20 0 Z"
          fill="none" stroke="#bfdbfe" stroke-width="6"/>
  </g>

  <!-- speech bubble 2 (filled, with dots = typing) -->
  <g transform="translate(830,60)">
    <path d="M20 0 H320 a20 20 0 0 1 20 20 V140 a20 20 0 0 1 -20 20 H90 L55 205 L65 160 H20 a20 20 0 0 1 -20 -20 V20 A20 20 0 0 1 20 0 Z"
          fill="#eff6ff"/>
    <circle cx="110" cy="80" r="12" fill="#2563EB"/>
    <circle cx="170" cy="80" r="12" fill="#2563EB"/>
    <circle cx="230" cy="80" r="12" fill="#2563EB"/>
  </g>
</svg>
