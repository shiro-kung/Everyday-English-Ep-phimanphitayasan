<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1224"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <circle cx="900" cy="140" r="210" fill="url(#glow)" filter="url(#blur1)"/>

  <!-- floating letter tags -->
  <g font-family="Arial, sans-serif" font-weight="700" opacity="0.5">
    <g transform="translate(100,90) rotate(-10)">
      <rect x="0" y="0" width="54" height="54" rx="10" fill="#ffffff" opacity="0.14"/>
      <text x="27" y="37" text-anchor="middle" fill="#ffffff" font-size="24">A</text>
    </g>
    <g transform="translate(190,260) rotate(8)">
      <rect x="0" y="0" width="54" height="54" rx="10" fill="#ffffff" opacity="0.14"/>
      <text x="27" y="37" text-anchor="middle" fill="#ffffff" font-size="24">B</text>
    </g>
    <g transform="translate(60,190) rotate(-4)">
      <rect x="0" y="0" width="54" height="54" rx="10" fill="#ffffff" opacity="0.14"/>
      <text x="27" y="37" text-anchor="middle" fill="#ffffff" font-size="24">C</text>
    </g>
  </g>

  <!-- flashcard stack -->
  <g transform="translate(780,90)">
    <g transform="rotate(-10 150 110)">
      <rect x="60" y="60" width="200" height="140" rx="16" fill="#5b21b6"/>
    </g>
    <g transform="rotate(6 150 110)">
      <rect x="50" y="50" width="200" height="140" rx="16" fill="#7c3aed"/>
    </g>
    <rect x="40" y="30" width="220" height="150" rx="18" fill="#faf5ff"/>
    <text x="150" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="72" fill="#6d28d9">Aa</text>
    <text x="150" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#7c3aed">apple</text>
  </g>
</svg>
